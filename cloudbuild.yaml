# Cloud Build for pyxaiapi — Docker build/push path.
# Use: gcloud builds submit . --config=cloudbuild.yaml
# Default image: us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/pyxaiapi

substitutions:
  _REGION: us-central1
  _REPO: cloud-run-source-deploy
  _NAME: pyxaiapi

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_NAME}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_NAME}
