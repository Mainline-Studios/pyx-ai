name: Pyx desktop release

# Push a tag like v1.5.0 to build installers and attach them to the GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (defaults to ref tag minus leading v)"
        required: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            ref="${GITHUB_REF_NAME}"
            echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    runs-on: macos-14
    env:
      PYX_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build .app + .dmg + .pkg
        run: bash packaging/build-macos.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyx-macos
          path: |
            dist/*.dmg
            dist/*.pkg

  windows:
    needs: version
    runs-on: windows-2022
    env:
      PYX_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build .exe installer
        shell: pwsh
        run: pwsh .\packaging\build-windows.ps1 -Version $env:PYX_VERSION
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyx-windows
          path: dist/*-setup.exe

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create / update release with installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pyx-macos/*
            artifacts/pyx-windows/*
          generate_release_notes: true

  # Mirrors the same .dmg / .pkg / .exe files to Firebase Hosting so users can
  # download from https://pyx-ai.web.app/pyx-download.html (not only GitHub).
  # Requires repo secret FIREBASE_SERVICE_ACCOUNT_PYX_AI (JSON for a service
  # account with Firebase Hosting Admin). The deploy step uses continue-on-error
  # so the workflow stays green if the secret is not configured yet.
  host-site-downloads:
    name: Publish installers to Hosting (/downloads/)
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage installers + manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p public/downloads
          shopt -s nullglob
          for f in artifacts/pyx-macos/*; do cp -f "$f" public/downloads/; done
          for f in artifacts/pyx-windows/*; do cp -f "$f" public/downloads/; done
          python3 <<'PY'
          import json, os
          from pathlib import Path
          v = os.environ["VERSION"]
          base = Path("public/downloads")
          files = {}
          for p in sorted(base.iterdir()):
              if p.name in (".gitkeep", "manifest.json") or p.is_dir():
                  continue
              n = p.name
              if n.endswith(".dmg"):
                  files["mac_dmg"] = n
              elif n.endswith(".pkg"):
                  files["mac_pkg"] = n
              elif n.endswith("-setup.exe"):
                  files["win_setup"] = n
          owner_repo = "Mainline-Studios/pyx-ai"
          tag = f"v{v}"
          mirror = {
              "mac_dmg": f"https://github.com/{owner_repo}/releases/download/{tag}/Pyx-{v}.dmg",
              "mac_pkg": f"https://github.com/{owner_repo}/releases/download/{tag}/Pyx-{v}.pkg",
              "win_setup": f"https://github.com/{owner_repo}/releases/download/{tag}/Pyx-{v}-setup.exe",
          }
          manifest = {
              "version": v,
              "base_path": "/downloads/",
              "files": files,
              "mirror": mirror,
          }
          (base / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase_hosting
        continue-on-error: true
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PYX_AI }}
          projectId: pyx-ai
          channelId: live

      - name: Hosting mirror status
        if: always()
        run: |
          if [ "${{ steps.firebase_hosting.outcome }}" != "success" ]; then
            echo "::notice:: Firebase Hosting mirror did not run (add repo secret FIREBASE_SERVICE_ACCOUNT_PYX_AI with Hosting Admin JSON, or check logs). Installers are still on GitHub Releases."
          else
            echo "Hosting deploy finished."
          fi
