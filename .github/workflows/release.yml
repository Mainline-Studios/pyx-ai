name: Pyx desktop release

# Push a tag like v1.5.0 to build installers and attach them to the GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (defaults to ref tag minus leading v)"
        required: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            ref="${GITHUB_REF_NAME}"
            echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    runs-on: macos-14
    env:
      PYX_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build .app + .dmg + .pkg
        run: bash packaging/build-macos.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyx-macos
          path: |
            dist/*.dmg
            dist/*.pkg

  windows:
    needs: version
    runs-on: windows-2022
    env:
      PYX_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build .exe installer
        shell: pwsh
        run: pwsh .\packaging\build-windows.ps1 -Version $env:PYX_VERSION
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyx-windows
          path: dist/*-setup.exe

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create / update release with installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pyx-macos/*
            artifacts/pyx-windows/*
          generate_release_notes: true
