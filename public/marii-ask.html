<body>
  <pre id="out">// asking…</pre>
  <script>
    (function () {
      var out = document.getElementById("out");
      var q = window.MariiAsk.requestFromLocation(location);
      window.MariiAsk.ask(q).then(function (data) {
        out.textContent = JSON.stringify(data, null, 2);
        document.title = data.ok ? "marii ask" : "marii ask · error";
      }).catch(function (err) {
        out.textContent = JSON.stringify({ ok: false, error: String(err && err.message || err) }, null, 2);
        document.title = "marii ask · error";
      });
    })();
  </script>
