<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyxCaptcha</title>
  <style>
    :root {
      --bg: #020617;
      --panel: #0f172a;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 8px 10px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
    }
    .cap-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .cap-head strong { font-size: 0.82rem; letter-spacing: 0.02em; }
    .cap-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      color: #7dd3fc;
    }
    .cap-body {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .cap-img-wrap {
      flex: 0 0 112px;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: #1e293b;
    }
    .cap-img-wrap img {
      display: block;
      width: 112px;
      height: 84px;
      object-fit: cover;
    }
    .cap-side { flex: 1; min-width: 0; }
    .cap-prompt {
      margin: 0 0 8px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .cap-colors {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    .cap-colors button {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
    }
    .cap-colors button:disabled { opacity: 0.45; cursor: wait; }
    .cap-colors button[data-c="red"] { border-color: #ef4444; }
    .cap-colors button[data-c="yellow"] { border-color: #eab308; }
    .cap-colors button[data-c="green"] { border-color: #22c55e; }
    .cap-colors button[data-c="off"] { border-color: #64748b; }
    .cap-not-signal {
      grid-column: 1 / -1;
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 7px 6px;
      border-radius: 6px;
      border: 1px solid #c084fc;
      background: rgba(192, 132, 252, 0.12);
      color: #e9d5ff;
      cursor: pointer;
    }
    .cap-not-signal:disabled { opacity: 0.45; cursor: wait; }
    .cap-status {
      margin: 8px 0 0;
      font-size: 0.72rem;
      min-height: 1.2em;
    }
    .cap-status--ok { color: var(--ok); }
    .cap-status--warn { color: var(--warn); }
    .cap-status--err { color: var(--err); }
    .cap-next {
      margin-top: 6px;
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text);
      cursor: pointer;
      display: none;
    }
    .cap-loading {
      padding: 24px 8px;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div id="capRoot" class="cap-loading">Loading challenge…</div>
  <script src="/js/pyx-captcha.js"></script>
</body>
</html>
