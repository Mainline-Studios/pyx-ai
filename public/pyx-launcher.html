<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PYX.</title>
  <link rel="icon" href="/brand/pyx-app-icon.png" type="image/png" />
  <style>
    :root {
      --pyx-blue: #0099ff;
      --pyx-black: #000000;
      --pyx-white: #ffffff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--pyx-white);
      color: var(--pyx-black);
      font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Display", "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 48px 40px 28px;
      max-width: 960px;
      margin: 0 auto;
    }
    .logo {
      margin: 0 0 56px;
      text-align: center;
      font-size: clamp(2.5rem, 6vw, 3.25rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .logo .k { color: var(--pyx-black); }
    .logo .b { color: var(--pyx-blue); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(28px, 5vh, 44px);
      padding: 12px 0 48px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px 32px;
      flex-wrap: wrap;
    }
    .row-label {
      font-size: clamp(1.15rem, 2.8vw, 1.65rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .row-label .k { color: var(--pyx-black); }
    .row-label .b { color: var(--pyx-blue); }

    .btn-open {
      flex-shrink: 0;
      min-width: clamp(140px, 28vw, 200px);
      height: clamp(52px, 10vw, 64px);
      padding: 0 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--pyx-blue);
      color: var(--pyx-black);
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      font-weight: 800;
      text-decoration: none;
      border: none;
      border-radius: 0;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .btn-open:hover {
      filter: brightness(0.96);
    }
    .btn-open:active {
      filter: brightness(0.9);
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px 24px;
      font-size: clamp(0.8rem, 1.8vw, 0.95rem);
      font-weight: 600;
      padding-top: 8px;
    }
    footer .k { color: var(--pyx-black); }
    footer .b { color: var(--pyx-blue); }
    footer a {
      color: inherit;
      text-decoration: none;
    }
    footer a:hover .b {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="shell">
    <h1 class="logo" aria-label="PYX.">
      <span class="k">PYX</span><span class="b">.</span>
    </h1>

    <main>
      <div class="row">
        <div class="row-label" id="lblTalk">
          <span class="k">PYX AI </span><span class="b">Talk.</span>
        </div>
        <a class="btn-open" href="/pyx-talk.html" aria-labelledby="lblTalk">Open</a>
      </div>
      <div class="row">
        <div class="row-label" id="lblCode">
          <span class="k">PYX AI </span><span class="b">Code.</span>
        </div>
        <a class="btn-open" href="/pyx-code.html" aria-labelledby="lblCode">Open</a>
      </div>
      <div class="row">
        <div class="row-label" id="lblPyxel">
          <span class="k">PYX</span><span class="b">EL</span><span class="k"> Image Generation</span>
        </div>
        <a class="btn-open" href="/pyxel-image.html" aria-labelledby="lblPyxel">Open</a>
      </div>
    </main>

    <footer>
      <div>
        <span class="k">Version </span><span class="b">1.5</span>
      </div>
      <div>
        <a href="/pyx-download.html">
          <span class="k">Check for </span><span class="b">updates</span>
        </a>
      </div>
      <div>
        <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener noreferrer">
          <span class="k">CC </span><span class="b">BY-NC-SA 4.0</span>
        </a>
      </div>
    </footer>
  </div>
</body>
</html>
