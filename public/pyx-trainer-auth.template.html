<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pyx AI — Trainer</title>
  <style>
    body { font-family: Georgia, "Times New Roman", Times, serif; background: #fff; color: #000; margin: 16px; line-height: 1.45; max-width: 44em; }
    p { margin: 0.75em 0; }
    code { font-family: ui-monospace, monospace; }
    a { color: #00e; }
    h1 { font-size: 1.35em; font-weight: normal; margin: 0 0 0.15em; letter-spacing: 0.02em; }
    .official { margin: 0 0 1.25em; font-size: 0.95em; color: #333; }
    label { display: block; margin-top: 0.5em; }
    input[type="password"] { font-family: inherit; font-size: 1rem; padding: 4px; width: 100%; max-width: 28em; box-sizing: border-box; border: 1px solid #000; }
    button { font-family: inherit; font-size: 1rem; margin-top: 0.75em; padding: 4px 12px; }
    .err { color: #a00; }
  </style>
</head>
<body>
  <h1>Pyx AI</h1>
  <p class="official"><strong>Official website</strong> — trainer sign-in below.</p>
  <p><strong>Trainer</strong> — enter the trainer password (one field only).</p>

  <form id="f" action="#" method="get">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required />
    <p><button type="submit">Open trainer</button></p>
  </form>
  <p id="msg" class="err" aria-live="polite"></p>
  <p><a href="/">Back to home</a></p>

  <h2 style="font-size:1.05em;font-weight:normal;margin:1.5em 0 0.35em;border-bottom:1px solid #ccc;padding-bottom:0.2em;">Public features</h2>
  <p>No password — <a href="/pyx-talk.html"><strong>Pyx AI Talk</strong></a> (Llama chat).</p>
  <p><a href="/pyx-code.html"><strong>Pyx AI Code</strong></a> — coding studio (GPT-OSS · Groq).</p>
  <p><a href="/pyxel-image.html"><strong>Pyxel Image generation</strong></a> — 100×100 pixel art from a prompt.</p>

  <script>
    (function () {
      var EXPECTED_SHA256_HEX = "__EXPECTED_SHA256_HEX__";
      var TARGET = "/pyx-firebase-trainer.html";
      var SESSION_KEY = "pyx_trainer_pw_ok";

      function params() {
        var q = (location.search || "").replace(/^\?/, "");
        var out = {};
        q.split("&").forEach(function (pair) {
          var i = pair.indexOf("=");
          if (i < 0) return;
          out[decodeURIComponent(pair.slice(0, i))] = decodeURIComponent(pair.slice(i + 1));
        });
        return out;
      }

      function bufToHex(buf) {
        var a = new Uint8Array(buf);
        var s = "";
        for (var i = 0; i < a.length; i++) s += a[i].toString(16).padStart(2, "0");
        return s;
      }

      document.getElementById("f").addEventListener("submit", function (e) {
        e.preventDefault();
        var msg = document.getElementById("msg");
        var pw = document.getElementById("pw").value;
        msg.textContent = "";
        if (!pw) {
          msg.textContent = "Enter the password.";
          return;
        }
        if (!EXPECTED_SHA256_HEX || EXPECTED_SHA256_HEX.indexOf("__") === 0) {
          msg.textContent = "Trainer auth page not built. Run: python3 scripts/build_trainer_auth.py";
          return;
        }
        if (!window.crypto || !window.crypto.subtle) {
          msg.textContent = "This browser needs Web Crypto (use a current browser).";
          return;
        }
        var enc = new TextEncoder();
        crypto.subtle.digest("SHA-256", enc.encode(pw)).then(function (hash) {
          if (bufToHex(hash) !== EXPECTED_SHA256_HEX) {
            msg.textContent = "Wrong password.";
            return;
          }
          try {
            sessionStorage.setItem(SESSION_KEY, "1");
          } catch (err) {
            msg.textContent = "Could not save session (try turning off private browsing).";
            return;
          }
          var next = params().next;
          if (next && next.indexOf("/") === 0 && next.indexOf("//") !== 0) {
            location.href = next;
          } else {
            location.href = TARGET;
          }
        }).catch(function () {
          msg.textContent = "Verification failed.";
        });
      });
    })();
  </script>
</body>
</html>
