<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pyx AI Talk</title>
  <style>
    :root {
      --bg: #eef0f4;
      --bg-mesh: radial-gradient(1200px 600px at 10% -10%, rgba(99, 102, 241, 0.12), transparent 50%),
        radial-gradient(900px 500px at 100% 0%, rgba(14, 165, 233, 0.1), transparent 45%),
        var(--bg);
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: rgba(15, 23, 42, 0.08);
      --text: #0f172a;
      --muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #0ea5e9;
      --user-bg: linear-gradient(135deg, #4f46e5 0%, #6366f1 48%, #0ea5e9 100%);
      --user-fg: #fff;
      --bot-bg: #f1f5f9;
      --bot-border: rgba(15, 23, 42, 0.06);
      --bad-bg: #fef2f2;
      --bad-border: rgba(220, 38, 38, 0.2);
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 40px -12px rgba(15, 23, 42, 0.12);
      --radius: 14px;
      --radius-sm: 10px;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17;
        --bg-mesh: radial-gradient(1200px 600px at 10% -10%, rgba(99, 102, 241, 0.18), transparent 50%),
          radial-gradient(900px 500px at 100% 0%, rgba(14, 165, 233, 0.12), transparent 45%),
          var(--bg);
        --surface: #121826;
        --surface-2: #1a2234;
        --border: rgba(148, 163, 184, 0.12);
        --text: #f1f5f9;
        --muted: #94a3b8;
        --primary: #818cf8;
        --primary-hover: #a5b4fc;
        --accent: #38bdf8;
        --user-bg: linear-gradient(135deg, #4f46e5 0%, #6366f1 45%, #0891b2 100%);
        --bot-bg: #1a2234;
        --bot-border: rgba(148, 163, 184, 0.12);
        --bad-bg: rgba(127, 29, 29, 0.25);
        --bad-border: rgba(248, 113, 113, 0.35);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 20px 50px -15px rgba(0, 0, 0, 0.45);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.55;
      color: var(--text);
      background: var(--bg-mesh);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 18px 48px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .home:hover {
      color: var(--primary);
      border-color: rgba(79, 70, 229, 0.25);
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--primary);
      background: rgba(79, 70, 229, 0.1);
      padding: 5px 10px;
      border-radius: 999px;
    }

    @media (prefers-color-scheme: dark) {
      .badge { background: rgba(129, 140, 248, 0.15); }
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin: 0 0 8px;
    }

    .lede {
      margin: 0 0 22px;
      font-size: 14px;
      color: var(--muted);
      max-width: 48ch;
    }
    .lede strong { color: var(--text); font-weight: 600; }

    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 20px 18px 18px;
    }

    .mode-row {
      border: none;
      margin: 0 0 18px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .mode-row legend {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0;
    }
    .mode-inner {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .mode-option {
      position: relative;
      flex: 1;
      min-width: 0;
    }
    .mode-option input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .mode-option span {
      display: block;
      text-align: center;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 9px;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .mode-option input:focus-visible + span {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .mode-option input:checked + span {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      .mode-option input:checked + span {
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }
    }

    #chat {
      min-height: 280px;
      max-height: min(52vh, 440px);
      overflow-y: auto;
      padding: 14px 12px;
      margin: 0 0 16px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 8px; }
    #chat::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 99px;
    }

    .msg {
      max-width: 92%;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg--user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--user-fg);
      border-bottom-right-radius: 5px;
      box-shadow: 0 4px 14px -4px rgba(79, 70, 229, 0.45);
    }
    .msg--bot {
      align-self: flex-start;
      background: var(--bot-bg);
      color: var(--text);
      border: 1px solid var(--bot-border);
      border-bottom-left-radius: 5px;
    }
    .msg--bad {
      align-self: flex-start;
      background: var(--bad-bg);
      border: 1px solid var(--bad-border);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }

    #composer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #composer textarea {
      flex: 1;
      min-height: 52px;
      max-height: 160px;
      resize: vertical;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.45;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #composer textarea::placeholder { color: var(--muted); opacity: 0.85; }
    #composer textarea:hover { border-color: rgba(79, 70, 229, 0.2); }
    #composer textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.18);
    }

    #send {
      flex-shrink: 0;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      box-shadow: 0 4px 14px -3px rgba(79, 70, 229, 0.55);
    }
    #send:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    #send:active:not(:disabled) {
      transform: scale(0.98);
    }
    #send:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    #status {
      margin: 14px 2px 0;
      min-height: 1.25em;
      font-size: 12px;
      color: var(--muted);
    }
    #status:empty { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <a class="home" href="/">← Home</a>
      <span class="badge">Llama · Groq</span>
    </div>

    <h1>Pyx AI Talk</h1>
    <p class="lede">
      <strong>Fast</strong>, <strong>Smart</strong>, or <strong>Thinking</strong> — powered by Llama on Groq.
      Replies come straight from the model.
    </p>

    <div class="panel">
      <fieldset class="mode-row" id="modeField">
        <legend>Mode</legend>
        <div class="mode-inner">
          <label class="mode-option">
            <input type="radio" name="talkMode" value="fast" checked />
            <span>Fast</span>
          </label>
          <label class="mode-option">
            <input type="radio" name="talkMode" value="smart" />
            <span>Smart</span>
          </label>
          <label class="mode-option">
            <input type="radio" name="talkMode" value="thinking" />
            <span>Thinking</span>
          </label>
        </div>
      </fieldset>

      <div id="chat" aria-live="polite"></div>

      <div id="composer">
        <textarea id="input" placeholder="Write a message…" rows="3" aria-label="Message"></textarea>
        <button type="button" id="send">Send</button>
      </div>
    </div>

    <p class="small" id="status"></p>
  </div>

  <script>
    (function () {
      var PYX_TALK_API_BASE = "https://pyxaiapi-574247481583.us-central1.run.app";
      var chatEl = document.getElementById("chat");
      var inputEl = document.getElementById("input");
      var sendBtn = document.getElementById("send");
      var statusEl = document.getElementById("status");
      var messages = [];
      var modeField = document.getElementById("modeField");

      var savedMode = localStorage.getItem("pyx.talk.mode");
      if (savedMode) {
        var r = modeField.querySelector('input[name="talkMode"][value="' + savedMode + '"]');
        if (r) r.checked = true;
      }

      function getMode() {
        var sel = modeField.querySelector('input[name="talkMode"]:checked');
        return sel ? sel.value : "fast";
      }

      function saveMode() {
        localStorage.setItem("pyx.talk.mode", getMode());
      }

      modeField.addEventListener("change", saveMode);

      function addBubble(text, role, extraClass) {
        var d = document.createElement("div");
        d.className = "msg msg--" + role + (extraClass ? " " + extraClass : "");
        d.textContent = text;
        chatEl.appendChild(d);
        chatEl.scrollTop = chatEl.scrollHeight;
      }

      function setBusy(b) {
        sendBtn.disabled = b;
        inputEl.disabled = b;
      }

      function send() {
        var text = (inputEl.value || "").trim();
        if (!text) return;
        var b = PYX_TALK_API_BASE.replace(/\/$/, "");
        saveMode();
        var mode = getMode();
        inputEl.value = "";
        messages.push({ role: "user", content: text });
        addBubble(text, "user");
        setBusy(true);
        statusEl.textContent =
          mode === "fast" ? "Fast reply…" : mode === "thinking" ? "Reasoning…" : "Thinking…";

        fetch(b + "/talk", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: messages, mode: mode }),
        })
          .then(function (r) {
            return r.text().then(function (t) {
              var j;
              try { j = JSON.parse(t); } catch (e) { j = { error: t }; }
              return { ok: r.ok, j: j, status: r.status };
            });
          })
          .then(function (x) {
            if (!x.ok) {
              var errLine = [x.j.error, typeof x.j.detail === "string" ? x.j.detail : x.j.detail ? JSON.stringify(x.j.detail) : ""]
                .filter(Boolean)
                .join(" — ");
              statusEl.textContent = "Error: " + (errLine || "HTTP " + x.status);
              messages.pop();
              chatEl.removeChild(chatEl.lastChild);
              return;
            }
            if (x.j.bad) {
              addBubble((x.j.censored || text) + "\n\n(That message didn’t pass Pyx moderation.)", "bot", "msg--bad");
              messages.pop();
              statusEl.textContent = "Blocked by moderator.";
              return;
            }
            var reply = x.j.reply || "";
            messages.push({ role: "assistant", content: reply });
            addBubble(reply, "bot");
            var modeLabel = x.j.mode ? x.j.mode.charAt(0).toUpperCase() + x.j.mode.slice(1) : "";
            var m = [modeLabel, x.j.model ? x.j.model : ""].filter(Boolean).join(" · ");
            statusEl.textContent = m || "";
          })
          .catch(function (e) {
            statusEl.textContent = "Network: " + (e.message || String(e));
            messages.pop();
            if (chatEl.lastChild) chatEl.removeChild(chatEl.lastChild);
          })
          .finally(function () {
            setBusy(false);
          });
      }

      sendBtn.addEventListener("click", send);
      inputEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      addBubble(
        "Hi! Pick a mode, then type below.",
        "bot"
      );
    })();
  </script>
</body>
</html>
