<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pyx AI Talk</title>
  <style>
    body { font-family: Georgia, "Times New Roman", Times, serif; background: #fff; color: #000; margin: 16px; line-height: 1.45; max-width: 42em; }
    p { margin: 0.65em 0; }
    a { color: #00e; }
    #chat {
      border: 1px solid #000;
      min-height: 220px;
      max-height: 420px;
      overflow-y: auto;
      padding: 10px;
      margin: 12px 0;
      background: #fafafa;
    }
    .msg { margin: 8px 0; padding: 6px 8px; border-radius: 4px; }
    .msg--user { background: #e0e7ff; margin-left: 12%; }
    .msg--bot { background: #f1f5f9; margin-right: 12%; }
    .msg--bad { background: #fee2e2; }
    #composer { display: flex; gap: 8px; margin-top: 8px; align-items: flex-end; }
    #composer textarea {
      flex: 1;
      min-height: 3.2em;
      resize: vertical;
      font-family: inherit;
      padding: 8px;
      border: 1px solid #000;
      box-sizing: border-box;
    }
    button { font-family: inherit; padding: 8px 14px; cursor: pointer; }
    .small { font-size: 0.85em; color: #333; }
    .mode-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 10px 0 6px; }
    .mode-row legend { font-size: 0.95em; padding: 0 6px 0 0; margin: 0; font-weight: normal; }
    .mode-option { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.95em; }
    .mode-option input { margin: 0; }
  </style>
</head>
<body>
  <p><a href="/">Home</a></p>
  <h1 style="font-size:1.25em;font-weight:normal;margin:0 0 0.5em;">Pyx AI Talk</h1>
  <p class="small">
    <strong>Fast</strong>, <strong>Smart</strong>, or <strong>Thinking</strong> (Llama on Groq). Messages and replies are moderated.
  </p>

  <fieldset class="mode-row" id="modeField">
    <legend>Mode</legend>
    <label class="mode-option"><input type="radio" name="talkMode" value="fast" checked /> Fast</label>
    <label class="mode-option"><input type="radio" name="talkMode" value="smart" /> Smart</label>
    <label class="mode-option"><input type="radio" name="talkMode" value="thinking" /> Thinking</label>
  </fieldset>

  <div id="chat" aria-live="polite"></div>
  <div id="composer">
    <textarea id="input" placeholder="Message…" rows="3"></textarea>
    <button type="button" id="send">Send</button>
  </div>
  <p class="small" id="status"></p>

  <script>
    (function () {
      var PYX_TALK_API_BASE = "https://pyxaiapi-574247481583.us-central1.run.app";
      var chatEl = document.getElementById("chat");
      var inputEl = document.getElementById("input");
      var sendBtn = document.getElementById("send");
      var statusEl = document.getElementById("status");
      var messages = [];
      var modeField = document.getElementById("modeField");

      var savedMode = localStorage.getItem("pyx.talk.mode");
      if (savedMode) {
        var r = modeField.querySelector('input[name="talkMode"][value="' + savedMode + '"]');
        if (r) r.checked = true;
      }

      function getMode() {
        var sel = modeField.querySelector('input[name="talkMode"]:checked');
        return sel ? sel.value : "fast";
      }

      function saveMode() {
        localStorage.setItem("pyx.talk.mode", getMode());
      }

      modeField.addEventListener("change", saveMode);

      function addBubble(text, role, extraClass) {
        var d = document.createElement("div");
        d.className = "msg msg--" + role + (extraClass ? " " + extraClass : "");
        d.textContent = text;
        chatEl.appendChild(d);
        chatEl.scrollTop = chatEl.scrollHeight;
      }

      function setBusy(b) {
        sendBtn.disabled = b;
        inputEl.disabled = b;
      }

      function send() {
        var text = (inputEl.value || "").trim();
        if (!text) return;
        var b = PYX_TALK_API_BASE.replace(/\/$/, "");
        saveMode();
        var mode = getMode();
        inputEl.value = "";
        messages.push({ role: "user", content: text });
        addBubble(text, "user");
        setBusy(true);
        statusEl.textContent = mode === "thinking" ? "Reasoning…" : "Thinking…";

        fetch(b + "/talk", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: messages, mode: mode }),
        })
          .then(function (r) {
            return r.text().then(function (t) {
              var j;
              try { j = JSON.parse(t); } catch (e) { j = { error: t }; }
              return { ok: r.ok, j: j, status: r.status };
            });
          })
          .then(function (x) {
            if (!x.ok) {
              statusEl.textContent = "Error: " + (x.j.error || x.j.detail || "HTTP " + x.status);
              messages.pop();
              chatEl.removeChild(chatEl.lastChild);
              return;
            }
            if (x.j.bad) {
              addBubble((x.j.censored || text) + "\n\n(That message didn’t pass Pyx moderation.)", "bot", "msg--bad");
              messages.pop();
              statusEl.textContent = "Blocked by moderator.";
              return;
            }
            var reply = x.j.reply || "";
            messages.push({ role: "assistant", content: reply });
            addBubble(reply, "bot");
            var modeLabel = x.j.mode ? x.j.mode.charAt(0).toUpperCase() + x.j.mode.slice(1) : "";
            var m = [modeLabel, x.j.model ? x.j.model : ""].filter(Boolean).join(" · ");
            statusEl.textContent = m || "";
          })
          .catch(function (e) {
            statusEl.textContent = "Network: " + (e.message || String(e));
            messages.pop();
            if (chatEl.lastChild) chatEl.removeChild(chatEl.lastChild);
          })
          .finally(function () {
            setBusy(false);
          });
      }

      sendBtn.addEventListener("click", send);
      inputEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      addBubble(
        "Hi! Pick a mode, then type below — Pyx keeps things safe.",
        "bot"
      );
    })();
  </script>
</body>
</html>
