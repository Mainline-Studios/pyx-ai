<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pyx Talk</title>
  <style>
    body { font-family: Georgia, "Times New Roman", Times, serif; background: #fff; color: #000; margin: 16px; line-height: 1.45; max-width: 42em; }
    p { margin: 0.65em 0; }
    code { font-family: ui-monospace, monospace; font-size: 0.9em; }
    a { color: #00e; }
    label { display: block; margin-top: 0.5em; font-size: 0.95em; }
    input[type="text"], input[type="password"] { width: 100%; max-width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #000; font-family: inherit; }
    #chat {
      border: 1px solid #000;
      min-height: 220px;
      max-height: 420px;
      overflow-y: auto;
      padding: 10px;
      margin: 12px 0;
      background: #fafafa;
    }
    .msg { margin: 8px 0; padding: 6px 8px; border-radius: 4px; }
    .msg--user { background: #e0e7ff; margin-left: 12%; }
    .msg--bot { background: #f1f5f9; margin-right: 12%; }
    .msg--bad { background: #fee2e2; }
    .meta { font-size: 0.8em; color: #444; margin-top: 4px; }
    #composer { display: flex; gap: 8px; margin-top: 8px; align-items: flex-end; }
    #composer textarea {
      flex: 1;
      min-height: 3.2em;
      resize: vertical;
      font-family: inherit;
      padding: 8px;
      border: 1px solid #000;
      box-sizing: border-box;
    }
    button { font-family: inherit; padding: 8px 14px; cursor: pointer; }
    .small { font-size: 0.85em; color: #333; }
  </style>
</head>
<body>
  <p><a href="/">Home</a></p>
  <h1 style="font-size:1.25em;font-weight:normal;margin:0 0 0.5em;">Pyx Talk</h1>
  <p class="small">
    Chat with a <strong>Llama-class</strong> model when your Pyx API has <code>PYX_TALK_LLM_KEY</code> set (e.g. Groq).
    Every message is <strong>moderated</strong> first; bot replies are checked too.
  </p>

  <label for="baseUrl">Pyx API base URL</label>
  <input id="baseUrl" type="text" value="https://pyxaiapi-574247481583.us-central1.run.app" />

  <label for="apiKey">Pyx API key (optional)</label>
  <input id="apiKey" type="password" placeholder="if your /talk route requires it" autocomplete="off" />

  <div id="chat" aria-live="polite"></div>
  <div id="composer">
    <textarea id="input" placeholder="Message…" rows="3"></textarea>
    <button type="button" id="send">Send</button>
  </div>
  <p class="small" id="status"></p>

  <script>
    (function () {
      var baseUrlEl = document.getElementById("baseUrl");
      var apiKeyEl = document.getElementById("apiKey");
      var chatEl = document.getElementById("chat");
      var inputEl = document.getElementById("input");
      var sendBtn = document.getElementById("send");
      var statusEl = document.getElementById("status");
      var messages = [];

      var savedBase = localStorage.getItem("pyx.talk.baseUrl");
      var savedKey = localStorage.getItem("pyx.talk.apiKey");
      if (savedBase) baseUrlEl.value = savedBase;
      if (savedKey) apiKeyEl.value = savedKey;

      function headers() {
        var h = { "Content-Type": "application/json" };
        var k = (apiKeyEl.value || "").trim();
        if (k) {
          h["X-API-Key"] = k;
          h["Authorization"] = "Bearer " + k;
        }
        return h;
      }

      function addBubble(text, role, extraClass) {
        var d = document.createElement("div");
        d.className = "msg msg--" + role + (extraClass ? " " + extraClass : "");
        d.textContent = text;
        chatEl.appendChild(d);
        chatEl.scrollTop = chatEl.scrollHeight;
      }

      function setBusy(b) {
        sendBtn.disabled = b;
        inputEl.disabled = b;
      }

      function saveCfg() {
        localStorage.setItem("pyx.talk.baseUrl", baseUrlEl.value || "");
        localStorage.setItem("pyx.talk.apiKey", apiKeyEl.value || "");
      }

      baseUrlEl.addEventListener("change", saveCfg);
      apiKeyEl.addEventListener("change", saveCfg);

      function send() {
        var text = (inputEl.value || "").trim();
        if (!text) return;
        var b = (baseUrlEl.value || "").replace(/\/$/, "");
        if (!b) {
          statusEl.textContent = "Set base URL.";
          return;
        }
        saveCfg();
        inputEl.value = "";
        messages.push({ role: "user", content: text });
        addBubble(text, "user");
        setBusy(true);
        statusEl.textContent = "Thinking…";

        fetch(b + "/talk", {
          method: "POST",
          headers: headers(),
          body: JSON.stringify({ messages: messages }),
        })
          .then(function (r) {
            return r.text().then(function (t) {
              var j;
              try { j = JSON.parse(t); } catch (e) { j = { error: t }; }
              return { ok: r.ok, j: j, status: r.status };
            });
          })
          .then(function (x) {
            if (!x.ok) {
              statusEl.textContent = "Error: " + (x.j.error || x.j.detail || "HTTP " + x.status);
              messages.pop();
              chatEl.removeChild(chatEl.lastChild);
              return;
            }
            if (x.j.bad) {
              addBubble((x.j.censored || text) + "\n\n(That message didn’t pass Pyx moderation.)", "bot", "msg--bad");
              messages.pop();
              statusEl.textContent = "Blocked by moderator.";
              return;
            }
            var reply = x.j.reply || "";
            messages.push({ role: "assistant", content: reply });
            addBubble(reply, "bot");
            var m = x.j.model ? "Model: " + x.j.model : "";
            statusEl.textContent = m;
          })
          .catch(function (e) {
            statusEl.textContent = "Network: " + (e.message || String(e));
            messages.pop();
            if (chatEl.lastChild) chatEl.removeChild(chatEl.lastChild);
          })
          .finally(function () {
            setBusy(false);
          });
      }

      sendBtn.addEventListener("click", send);
      inputEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      addBubble(
        "Hi! I’m Pyx Talk. Type below — I’ll answer with Llama when the API is configured, and Pyx keeps things safe.",
        "bot"
      );
    })();
  </script>
</body>
</html>
