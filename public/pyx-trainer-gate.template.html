<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Train Pyx — access</title>
  <style>
    body { font-family: Georgia, "Times New Roman", Times, serif; background: #fff; color: #000; margin: 16px; line-height: 1.45; max-width: 40em; }
    p { margin: 0.75em 0; }
    label { display: block; margin-top: 1em; }
    input[type="password"] { width: 100%; max-width: 28em; font-size: 1rem; padding: 6px; box-sizing: border-box; }
    button { margin-top: 0.75em; font-family: inherit; font-size: 1rem; padding: 6px 14px; }
    .err { color: #b00; }
    code { font-family: ui-monospace, monospace; }
    a { color: #00e; }
  </style>
</head>
<body>
  <p>Pyx content filter API.</p>
  <p>Enter the trainer passphrase to open <code>/pyx-firebase-trainer.html</code>.</p>

  <form id="f" action="#" method="get">
    <label for="pw">Passphrase</label>
    <input id="pw" type="password" name="pw" autocomplete="current-password" required />
    <p><button type="submit">Continue to trainer</button></p>
  </form>
  <p id="msg" class="err" aria-live="polite"></p>
  <p><a href="/">Back to home</a></p>

  <script>
    (function () {
      var EXPECTED_SHA256_HEX = "__EXPECTED_SHA256_HEX__";
      var TARGET = "/pyx-firebase-trainer.html";
      var SESSION_KEY = "pyx_trainer_gate_ok";

      function params() {
        var q = (location.search || "").replace(/^\?/, "");
        var out = {};
        q.split("&").forEach(function (pair) {
          var i = pair.indexOf("=");
          if (i < 0) return;
          out[decodeURIComponent(pair.slice(0, i))] = decodeURIComponent(pair.slice(i + 1));
        });
        return out;
      }

      function bufToHex(buf) {
        var a = new Uint8Array(buf);
        var s = "";
        for (var i = 0; i < a.length; i++) s += a[i].toString(16).padStart(2, "0");
        return s;
      }

      document.getElementById("f").addEventListener("submit", function (e) {
        e.preventDefault();
        var msg = document.getElementById("msg");
        var pw = document.getElementById("pw").value;
        msg.textContent = "";
        if (!pw) {
          msg.textContent = "Enter the passphrase.";
          return;
        }
        if (!EXPECTED_SHA256_HEX || EXPECTED_SHA256_HEX.indexOf("__") === 0) {
          msg.textContent = "Gate not configured. Build with scripts/set_gate_hash.py before deploy.";
          return;
        }
        if (!window.crypto || !window.crypto.subtle) {
          msg.textContent = "This browser cannot verify the passphrase (needs Web Crypto).";
          return;
        }
        var enc = new TextEncoder();
        crypto.subtle.digest("SHA-256", enc.encode(pw)).then(function (hash) {
          var hex = bufToHex(hash);
          if (hex !== EXPECTED_SHA256_HEX) {
            msg.textContent = "Incorrect passphrase.";
            return;
          }
          try {
            sessionStorage.setItem(SESSION_KEY, "1");
          } catch (err) {
            msg.textContent = "Could not save session (private browsing?).";
            return;
          }
          var next = params().next;
          if (next && next.indexOf("/") === 0 && next.indexOf("//") !== 0) {
            location.href = next;
          } else {
            location.href = TARGET;
          }
        }).catch(function () {
          msg.textContent = "Verification failed.";
        });
      });
    })();
  </script>
</body>
</html>
